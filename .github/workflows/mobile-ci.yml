name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo install --check
      - run: pnpm audit --prod
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm exec expo export --platform ios --output-dir /tmp/dsh-ios-export
      - run: pnpm exec expo export --platform android --output-dir /tmp/dsh-android-export
      - run: cd android && ./gradlew :app:assembleDebug --no-daemon
